# cargo-deny: what CI accepts in the dependency tree. `cargo deny check` runs it locally.

[graph]
all-features = true

[advisories]
# Any RUSTSEC advisory (vulnerable, unsound, unmaintained, yanked) against a dependency fails CI.
# To accept one deliberately, add it here with the reason:
#   ignore = [{ id = "RUSTSEC-YYYY-NNNN", reason = "..." }]
ignore = []

[licenses]
# Permissive licenses, plus MPL-2.0 (file-level copyleft: fine to link, changes to those files stay MPL).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

# fat itself has no license yet (publish = false in Cargo.toml): only its dependencies are checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
