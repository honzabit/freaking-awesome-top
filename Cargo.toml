[package]
name = "fat"
version = "0.1.0"
edition = "2024"
# rusqlite 0.41 (bundled SQLite 3.54)
rust-version = "1.89"
# Not on crates.io until a license is chosen (deny.toml skips the license check for
# unpublished crates; set `license` and drop this line together).
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "5"
libc = "0.2.191"
ratatui = "0.30"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# No "multithread": rayon worker spin cost ~4% of a core per 2s sample on 1k procs.
sysinfo = { version = "0.33", default-features = false, features = ["system", "user"] }
toml = "0.8"
ureq = { version = "2", features = ["json"] }
