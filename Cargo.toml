[package]
name = "fat"
version = "0.2.1"
edition = "2024"
# rusqlite 0.41 (bundled SQLite 3.54)
rust-version = "1.89"
description = "Freaking Awesome Top: what is my machine (or fleet) doing, why, and for whom? For humans and agents."
license = "MIT"
repository = "https://github.com/honzabit/freaking-awesome-top"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "5"
libc = "0.2.191"
ratatui = "0.30"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# No "multithread": rayon worker spin cost ~4% of a core per 2s sample on 1k procs.
sysinfo = { version = "0.33", default-features = false, features = ["system", "user"] }
toml = "0.8"
# Settings screen: edit config.toml keeping comments and layout (same project as toml).
toml_edit = "0.22"
ureq = { version = "2", features = ["json"] }
# fat update: verify the release's signed SHA256SUMS (Ed25519) and each archive's SHA-256.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
# [peers] asn: the iptoasn.com table is a .tsv.gz (flate2 is already in the tree via ureq).
flate2 = "1"
